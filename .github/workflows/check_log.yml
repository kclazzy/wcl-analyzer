name: check-log
on:
  push:
    branches: [debug/log]
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Гайды и тесты
        env:
          WCL_GAME_DATA: bundled
        run: |
          python tools/update_guides.py > debug_guides.txt 2>&1 || true
          cp wcl_analyzer/data/guides.json debug_guides.json; cp wcl_analyzer/data/guides_ru.json debug_guides_ru.json
          python tests/test_pipeline.py > debug_tests.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f debug_guides.txt debug_guides.json debug_guides_ru.json debug_tests.txt && git commit -m "guides" && git push
