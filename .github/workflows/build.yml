# Автосборка: Windows-программа (.exe) и Android-приложение (.apk).
# Запускается при каждой загрузке файлов в репозиторий и вручную (Actions → Сборка → Run workflow),
# а также из «Ссылок на гайды» (gh workflow run). Каждая успешная сборка main публикует выпуск
# v1.1.<номер запуска> (Releases → latest): WCL-Analyzer.exe, WCL-Analyzer.apk, архив кода и update.json.
# Файлы отдельного запуска есть и во вкладке Actions → запуск → Artifacts.
name: Сборка

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python tests/test_pipeline.py
      - run: python tests/test_web.py
      - run: python tests/test_update.py
      - run: python tests/test_local_security.py

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версия сборки
        shell: bash
        run: |
          # Отпечаток оболочки: Python, библиотеки и настройки сборки. Пока он тот же —
          # программа обновляется скачиванием одного кода, без переустановки
          SHELL_ID=$(cat requirements.txt android/buildozer.spec android/main.py packaging/windows/wcl_app.py \
                     packaging/windows/wcl_analyzer.spec wcl_boot.py | tr -d '\r' | sha256sum | cut -c1-12)
          printf '"""Номер сборки и отпечаток оболочки. Сборка на GitHub перезаписывает этот файл."""\nBUILD = "%s"\nSHELL_ID = "%s"\n' \
            "${{ github.run_number }}" "$SHELL_ID" > wcl_analyzer/_build.py
          sed -i "s/^SHELL_ID = \"dev\"/SHELL_ID = \"$SHELL_ID\"/" wcl_boot.py
          echo "SHELL_ID=$SHELL_ID" >> "$GITHUB_ENV"
          cat wcl_analyzer/_build.py
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm packaging/windows/wcl_analyzer.spec
      - name: Проверка запуска программы
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\WCL Analyzer.exe" -ArgumentList "ui","--no-browser","--port","8799" -PassThru
          Start-Sleep -Seconds 15
          $r = Invoke-RestMethod http://127.0.0.1:8799/api/status
          if ($r.app -ne "exe") { throw "Программа не ответила как ожидалось" }
          $job = (Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8799/api/analyze -ContentType "application/json" -Body '{"demo":true}').job
          Start-Sleep -Seconds 25
          $s = Invoke-RestMethod "http://127.0.0.1:8799/api/job/$job"
          if ($s.state -ne "done") { throw "Демо-разбор не завершился: $($s.state) $($s.error)" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: WCL-Analyzer-Windows
          path: dist/WCL Analyzer.exe

  android:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Версия сборки
        shell: bash
        run: |
          # Отпечаток оболочки: Python, библиотеки и настройки сборки. Пока он тот же —
          # программа обновляется скачиванием одного кода, без переустановки
          SHELL_ID=$(cat requirements.txt android/buildozer.spec android/main.py packaging/windows/wcl_app.py \
                     packaging/windows/wcl_analyzer.spec wcl_boot.py | tr -d '\r' | sha256sum | cut -c1-12)
          printf '"""Номер сборки и отпечаток оболочки. Сборка на GitHub перезаписывает этот файл."""\nBUILD = "%s"\nSHELL_ID = "%s"\n' \
            "${{ github.run_number }}" "$SHELL_ID" > wcl_analyzer/_build.py
          sed -i "s/^SHELL_ID = \"dev\"/SHELL_ID = \"$SHELL_ID\"/" wcl_boot.py
          echo "SHELL_ID=$SHELL_ID" >> "$GITHUB_ENV"
          cat wcl_analyzer/_build.py
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Системные пакеты для сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache
      - run: pip install --upgrade buildozer "cython==0.29.37" setuptools
      - name: Кэш Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ hashFiles('android/buildozer.spec') }}
      - name: Ключ подписи APK
        # Постоянный ключ из секретов репозитория: Play Защита доверяет приложению, подписанному
        # одним и тем же ключом, и обновления ставятся поверх без удаления (данные сохраняются).
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          PW: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "$KS" | base64 -d > "$HOME/wcl.keystore"
          else
            echo "::warning title=Ключ подписи::Секреты ANDROID_KEYSTORE и ANDROID_KEY_PASS не заданы — APK подписан временным ключом. Обновление поверх старой версии не встанет."
            PW=temp-$(date +%s%N)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$HOME/wcl.keystore" -storetype PKCS12 -alias wcl -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=WCL Analyzer"
          fi
          {
            echo "P4A_RELEASE_KEYSTORE=$HOME/wcl.keystore"
            echo "P4A_RELEASE_KEYALIAS=wcl"
            echo "P4A_RELEASE_KEYSTORE_PASSWD=$PW"
            echo "P4A_RELEASE_KEYALIAS_PASSWD=$PW"
          } >> "$GITHUB_ENV"
      - name: Сборка APK
        run: |
          cp -r wcl_analyzer android/
          cp wcl_boot.py android/
          cd android
          # Номер версии растёт с каждой сборкой — Android ставит обновление поверх
          sed -i "s/^version = .*/version = 1.1.${{ github.run_number }}/" buildozer.spec
          set +e
          { yes || true; } | buildozer -v android release > build.log 2>&1
          code=${PIPESTATUS[1]}
          set -e
          if [ "$code" != "0" ]; then
            # Причина ошибки — в сводку запуска (её видно без скачивания полного журнала).
            # Сводка берёт до ~4 КБ на сообщение, поэтому только строки с ошибками, по частям.
            sed -e 's/\x1b\[[0-9;]*m//g' build.log | grep -v -e "libtool: compile" -e "^#     " > clean.log || true
            { grep -E "ERROR|Error|error:|Traceback|Exception|Command failed|No such file|not found" clean.log \
                | grep -v -e "-Werror" -e "-fexceptions" | tail -30; echo "----- конец журнала -----"; \
              grep -v "^\[DEBUG\]:   \s*$" clean.log | tail -40; } | cut -c1-260 > tail.txt
            split -C 3800 tail.txt part_
            for f in $(ls part_* | head -9); do
              msg=$(sed -e 's/%/%25/g' "$f" | sed -e ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=Сборка APK ($f)::$msg"
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: WCL-Analyzer-Android
          path: android/bin/*.apk

  # После каждой успешной сборки main — выпуск с прямыми ссылками (без входа в GitHub и без zip):
  # программа сама проверяет его кнопкой «Проверить обновления». Публикует и ручной запуск на main
  # (в том числе еженедельный из «Ссылок на гайды»); два выпуска одновременно не публикуются.
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [windows, android]
    runs-on: ubuntu-22.04
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Версия сборки
        shell: bash
        run: |
          # Отпечаток оболочки: Python, библиотеки и настройки сборки. Пока он тот же —
          # программа обновляется скачиванием одного кода, без переустановки
          SHELL_ID=$(cat requirements.txt android/buildozer.spec android/main.py packaging/windows/wcl_app.py \
                     packaging/windows/wcl_analyzer.spec wcl_boot.py | tr -d '\r' | sha256sum | cut -c1-12)
          printf '"""Номер сборки и отпечаток оболочки. Сборка на GitHub перезаписывает этот файл."""\nBUILD = "%s"\nSHELL_ID = "%s"\n' \
            "${{ github.run_number }}" "$SHELL_ID" > wcl_analyzer/_build.py
          sed -i "s/^SHELL_ID = \"dev\"/SHELL_ID = \"$SHELL_ID\"/" wcl_boot.py
          echo "SHELL_ID=$SHELL_ID" >> "$GITHUB_ENV"
          cat wcl_analyzer/_build.py
      - uses: actions/download-artifact@v4
        with: {path: out}
      - name: Файлы выпуска
        run: |
          cp "out/WCL-Analyzer-Windows/WCL Analyzer.exe" WCL-Analyzer.exe
          cp out/WCL-Analyzer-Android/*.apk WCL-Analyzer.apk
      - name: Архив кода и update.json
        run: |
          zip -qr wcl_analyzer-code.zip wcl_analyzer -x '*/__pycache__/*' '*.pyc'
          SHA=$(sha256sum wcl_analyzer-code.zip | cut -d' ' -f1)
          # отпечаток файлов кода — для проверки обновления, скачанного по файлам через jsDelivr
          CODE_SHA=$(python3 -B -c "from wcl_analyzer.update import code_tree_hash; print(code_tree_hash('wcl_analyzer'))")
          # программа целиком: контрольная сумма и размер — программа проверяет их перед заменой
          EXE_SHA=$(sha256sum WCL-Analyzer.exe | cut -d' ' -f1); EXE_SIZE=$(stat -c %s WCL-Analyzer.exe)
          APK_SHA=$(sha256sum WCL-Analyzer.apk | cut -d' ' -f1); APK_SIZE=$(stat -c %s WCL-Analyzer.apk)
          printf '{"format": 2, "build": %s, "shell": "%s", "sha256": "%s", "code_sha256": "%s", "exe_sha256": "%s", "exe_size": %s, "apk_sha256": "%s", "apk_size": %s, "date": "%s"}\n' \
            "${{ github.run_number }}" "$SHELL_ID" "$SHA" "$CODE_SHA" "$EXE_SHA" "$EXE_SIZE" "$APK_SHA" "$APK_SIZE" \
            "$(date -u +%FT%TZ)" > update.json
          cat update.json
          python3 -c "import json; json.load(open('update.json'))"
          echo "UPDATE_JSON=$(cat update.json)" >> "$GITHUB_ENV"
          ls -la WCL-Analyzer.* wcl_analyzer-code.zip update.json
      - uses: softprops/action-gh-release@v2
        with:
          # метка вида v1.1.N: по ней зеркало jsDelivr находит последнюю версию
          tag_name: v1.1.${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          make_latest: true
          body: |
            Скачать: WCL-Analyzer.apk — для телефона, WCL-Analyzer.exe — для ПК.
            Уже установленная программа обновляется сама: «Проверить обновления» внизу страницы.
            <!--update ${{ env.UPDATE_JSON }} -->
          files: |
            WCL-Analyzer.exe
            WCL-Analyzer.apk
            wcl_analyzer-code.zip
            update.json
