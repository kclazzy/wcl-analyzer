# Автосборка: Windows-программа (.exe) и Android-приложение (.apk).
# Запускается при каждой загрузке файлов в репозиторий и вручную (Actions → Сборка → Run workflow),
# а также из «Ссылок на гайды» (gh workflow run). Каждая успешная сборка main публикует выпуск
# v1.1.<номер запуска> (Releases → latest): WCL-Analyzer.exe, WCL-Analyzer.apk, архив кода и update.json.
# Файлы отдельного запуска есть и во вкладке Actions → запуск → Artifacts.
name: Сборка

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-22.04
    env:
      WCL_GAME_DATA: bundled   # тесты — на таблице из этой сборки (копия в репозитории может обновиться позже)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - run: python tests/test_pipeline.py
      - run: python tests/test_web.py
      - run: python tests/test_update.py
      - run: python tests/test_local_security.py

  # Сборки идут параллельно с тестами (раньше — после них): выпуск всё равно ждёт и тесты, и обе сборки
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версия сборки
        shell: bash
        run: |
          # Отпечаток оболочки: Python, библиотеки и настройки сборки. Пока он тот же —
          # программа обновляется скачиванием одного кода, без переустановки
          SHELL_ID=$(cat requirements.txt android/buildozer.spec android/main.py packaging/windows/wcl_app.py \
                     packaging/windows/wcl_analyzer.spec wcl_boot.py | tr -d '\r' | sha256sum | cut -c1-12)
          printf '"""Номер сборки и отпечаток оболочки. Сборка на GitHub перезаписывает этот файл."""\nBUILD = "%s"\nSHELL_ID = "%s"\n' \
            "${{ github.run_number }}" "$SHELL_ID" > wcl_analyzer/_build.py
          sed -i "s/^SHELL_ID = \"dev\"/SHELL_ID = \"$SHELL_ID\"/" wcl_boot.py
          echo "SHELL_ID=$SHELL_ID" >> "$GITHUB_ENV"
          cat wcl_analyzer/_build.py
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm packaging/windows/wcl_analyzer.spec
      - name: Проверка запуска программы
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\WCL Analyzer.exe" -ArgumentList "ui","--no-browser","--port","8799" -PassThru
          $r = $null
          for ($i = 0; $i -lt 40 -and -not $r; $i++) { try { $r = Invoke-RestMethod http://127.0.0.1:8799/api/status } catch { Start-Sleep 1 } }
          if (-not $r -or $r.app -ne "exe") { throw "Программа не ответила как ожидалось" }
          $job = (Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8799/api/analyze -ContentType "application/json" `
                   -Headers @{ Origin = "http://127.0.0.1:8799" } -Body '{"demo":true}').job
          $s = $null
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 1; $s = Invoke-RestMethod "http://127.0.0.1:8799/api/job/$job"; if ($s.state -ne "running") { break } }
          if ($s.state -ne "done") { throw "Демо-разбор не завершился: $($s.state) $($s.error)" }
          Stop-Process -Id $p.Id
      - name: Проверка обновления целиком (как у пользователей)
        shell: pwsh
        run: |
          # Новая сборка скачивает последний выпуск .exe, заменяет себя и перезапускается с теми же параметрами
          $dir = Join-Path $env:RUNNER_TEMP "upd"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "dist\WCL Analyzer.exe" "$dir\WCL-Analyzer.exe"
          $before = (Get-FileHash "$dir\WCL-Analyzer.exe").Hash
          Start-Process -FilePath "$dir\WCL-Analyzer.exe" -ArgumentList "ui","--no-browser","--port","8798" | Out-Null
          $v = $null
          for ($i = 0; $i -lt 40 -and -not $v; $i++) { try { $v = Invoke-RestMethod http://127.0.0.1:8798/api/version } catch { Start-Sleep 1 } }
          if (-not $v) { throw "Программа не запустилась" }
          $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8798/api/update/apply -ContentType "application/json" `
                 -Headers @{ Origin = "http://127.0.0.1:8798" } -Body '{"kind":"full"}' -TimeoutSec 600
          if (-not $r.ok) { throw "Обновление не началось: $($r | ConvertTo-Json -Compress)" }
          $new = $null
          for ($i = 0; $i -lt 60 -and -not $new; $i++) {
            Start-Sleep 2
            try { $x = Invoke-RestMethod http://127.0.0.1:8798/api/version; if ("$($x.build)" -ne "$($v.build)") { $new = $x } } catch {}
          }
          if (-not $new) { throw "После обновления программа не перезапустилась новой версией (была сборка $($v.build))" }
          if ((Get-FileHash "$dir\WCL-Analyzer.exe").Hash -eq $before) { throw ".exe не заменён" }
          if (Test-Path "$dir\WCL Analyzer.new.exe") { throw "Остался временный файл обновления" }
          Write-Host "Обновление целиком работает: сборка $($v.build) -> $($new.build)"
          Get-Process | Where-Object { $_.Path -like "$dir*" } | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        with:
          name: WCL-Analyzer-Windows
          path: dist/WCL Analyzer.exe

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Версия сборки
        shell: bash
        run: |
          # Отпечаток оболочки: Python, библиотеки и настройки сборки. Пока он тот же —
          # программа обновляется скачиванием одного кода, без переустановки
          SHELL_ID=$(cat requirements.txt android/buildozer.spec android/main.py packaging/windows/wcl_app.py \
                     packaging/windows/wcl_analyzer.spec wcl_boot.py | tr -d '\r' | sha256sum | cut -c1-12)
          printf '"""Номер сборки и отпечаток оболочки. Сборка на GitHub перезаписывает этот файл."""\nBUILD = "%s"\nSHELL_ID = "%s"\n' \
            "${{ github.run_number }}" "$SHELL_ID" > wcl_analyzer/_build.py
          sed -i "s/^SHELL_ID = \"dev\"/SHELL_ID = \"$SHELL_ID\"/" wcl_boot.py
          echo "SHELL_ID=$SHELL_ID" >> "$GITHUB_ENV"
          cat wcl_analyzer/_build.py
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - name: Системные пакеты для сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache
      - run: pip install --upgrade buildozer "cython==0.29.37" setuptools
      - name: Кэш Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ hashFiles('android/buildozer.spec') }}
      - name: Ключ подписи APK
        # Постоянный ключ из секретов репозитория: Play Защита доверяет приложению, подписанному
        # одним и тем же ключом, и обновления ставятся поверх без удаления (данные сохраняются).
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          PW: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "$KS" | base64 -d > "$HOME/wcl.keystore"
          else
            echo "::warning title=Ключ подписи::Секреты ANDROID_KEYSTORE и ANDROID_KEY_PASS не заданы — APK подписан временным ключом. Обновление поверх старой версии не встанет."
            PW=temp-$(date +%s%N)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$HOME/wcl.keystore" -storetype PKCS12 -alias wcl -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=WCL Analyzer"
          fi
          {
            echo "P4A_RELEASE_KEYSTORE=$HOME/wcl.keystore"
            echo "P4A_RELEASE_KEYALIAS=wcl"
            echo "P4A_RELEASE_KEYSTORE_PASSWD=$PW"
            echo "P4A_RELEASE_KEYALIAS_PASSWD=$PW"
          } >> "$GITHUB_ENV"
      - name: Сборка APK
        run: |
          cp -r wcl_analyzer android/
          cp wcl_boot.py android/
          cd android
          # Номер версии растёт с каждой сборкой — Android ставит обновление поверх
          sed -i "s/^version = .*/version = 1.1.${{ github.run_number }}/" buildozer.spec
          set +e
          { yes || true; } | buildozer -v android release > build.log 2>&1
          code=${PIPESTATUS[1]}
          set -e
          if [ "$code" != "0" ]; then
            # Причина ошибки — в сводку запуска (её видно без скачивания полного журнала).
            # Сводка берёт до ~4 КБ на сообщение, поэтому только строки с ошибками, по частям.
            sed -e 's/\x1b\[[0-9;]*m//g' build.log | grep -v -e "libtool: compile" -e "^#     " > clean.log || true
            { grep -E "ERROR|Error|error:|Traceback|Exception|Command failed|No such file|not found" clean.log \
                | grep -v -e "-Werror" -e "-fexceptions" | tail -30; echo "----- конец журнала -----"; \
              grep -v "^\[DEBUG\]:   \s*$" clean.log | tail -40; } | cut -c1-260 > tail.txt
            split -C 3800 tail.txt part_
            for f in $(ls part_* | head -9); do
              msg=$(sed -e 's/%/%25/g' "$f" | sed -e ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=Сборка APK ($f)::$msg"
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: WCL-Analyzer-Android
          path: android/bin/*.apk

  # После каждой успешной сборки main — выпуск с прямыми ссылками (без входа в GitHub и без zip):
  # программа сама проверяет его кнопкой «Проверить обновления». Публикует и ручной запуск на main
  # (в том числе еженедельный из «Ссылок на гайды»); два выпуска одновременно не публикуются.
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [tests, windows, android]
    runs-on: ubuntu-22.04
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Версия сборки
        shell: bash
        run: |
          # Отпечаток оболочки: Python, библиотеки и настройки сборки. Пока он тот же —
          # программа обновляется скачиванием одного кода, без переустановки
          SHELL_ID=$(cat requirements.txt android/buildozer.spec android/main.py packaging/windows/wcl_app.py \
                     packaging/windows/wcl_analyzer.spec wcl_boot.py | tr -d '\r' | sha256sum | cut -c1-12)
          printf '"""Номер сборки и отпечаток оболочки. Сборка на GitHub перезаписывает этот файл."""\nBUILD = "%s"\nSHELL_ID = "%s"\n' \
            "${{ github.run_number }}" "$SHELL_ID" > wcl_analyzer/_build.py
          sed -i "s/^SHELL_ID = \"dev\"/SHELL_ID = \"$SHELL_ID\"/" wcl_boot.py
          echo "SHELL_ID=$SHELL_ID" >> "$GITHUB_ENV"
          cat wcl_analyzer/_build.py
      - uses: actions/download-artifact@v4
        with: {path: out}
      - name: Файлы выпуска
        run: |
          cp "out/WCL-Analyzer-Windows/WCL Analyzer.exe" WCL-Analyzer.exe
          cp out/WCL-Analyzer-Android/*.apk WCL-Analyzer.apk
      - name: Архив кода и update.json
        run: |
          zip -qr wcl_analyzer-code.zip wcl_analyzer -x '*/__pycache__/*' '*.pyc'
          SHA=$(sha256sum wcl_analyzer-code.zip | cut -d' ' -f1)
          # отпечаток файлов кода — для проверки обновления, скачанного по файлам через jsDelivr
          CODE_SHA=$(python3 -B -c "from wcl_analyzer.update import code_tree_hash; print(code_tree_hash('wcl_analyzer'))")
          # программа целиком: контрольная сумма и размер — программа проверяет их перед заменой
          EXE_SHA=$(sha256sum WCL-Analyzer.exe | cut -d' ' -f1); EXE_SIZE=$(stat -c %s WCL-Analyzer.exe)
          APK_SHA=$(sha256sum WCL-Analyzer.apk | cut -d' ' -f1); APK_SIZE=$(stat -c %s WCL-Analyzer.apk)
          printf '{"format": 2, "build": %s, "shell": "%s", "sha256": "%s", "code_sha256": "%s", "exe_sha256": "%s", "exe_size": %s, "apk_sha256": "%s", "apk_size": %s, "date": "%s"}\n' \
            "${{ github.run_number }}" "$SHELL_ID" "$SHA" "$CODE_SHA" "$EXE_SHA" "$EXE_SIZE" "$APK_SHA" "$APK_SIZE" \
            "$(date -u +%FT%TZ)" > update.json
          cat update.json
          python3 -c "import json; json.load(open('update.json'))"
          echo "UPDATE_JSON=$(cat update.json)" >> "$GITHUB_ENV"
          ls -la WCL-Analyzer.* wcl_analyzer-code.zip update.json
      - uses: softprops/action-gh-release@v2
        with:
          # метка вида v1.1.N: по ней зеркало jsDelivr находит последнюю версию
          tag_name: v1.1.${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          make_latest: true
          body: |
            Скачать: WCL-Analyzer.apk — для телефона, WCL-Analyzer.exe — для ПК.
            Уже установленная программа обновляется сама: «Проверить обновления» внизу страницы.
            <!--update ${{ env.UPDATE_JSON }} -->
          files: |
            WCL-Analyzer.exe
            WCL-Analyzer.apk
            wcl_analyzer-code.zip
            update.json

  # После выпуска — обновление так, как его получают пользователи: ПРЕДЫДУЩАЯ опубликованная версия
  # обновляется до только что вышедшей (настоящие файлы выпусков с GitHub)
  update-pc:
    needs: publish
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NEW_BUILD: ${{ github.run_number }}
    steps:
      - name: Прошлая версия .exe обновляется до новой (код и программа целиком)
        shell: pwsh
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $prev = (gh release list --repo $repo --limit 5 --json tagName --jq '.[].tagName') | Where-Object { $_ -ne "v1.1.$env:NEW_BUILD" } | Select-Object -First 1
          if (-not $prev) { Write-Host "Прошлого выпуска нет — проверять нечего"; exit 0 }
          Write-Host "Прошлый выпуск: $prev, новый: v1.1.$env:NEW_BUILD"
          function Wait-Build($port, $want, $sec) {
            for ($i = 0; $i -lt $sec / 2; $i++) {
              Start-Sleep 2
              try { $x = Invoke-RestMethod "http://127.0.0.1:$port/api/version"; if ("$($x.build)" -eq "$want") { return $x } } catch {}
            }
            return $null
          }
          function Start-Old($name, $port) {
            $dir = Join-Path $env:RUNNER_TEMP $name
            New-Item -ItemType Directory -Force $dir | Out-Null
            gh release download $prev --repo $repo -p WCL-Analyzer.exe -D $dir --clobber
            $env:WCL_DATA_DIR = Join-Path $dir "data"   # своя папка данных — как у нового пользователя
            Start-Process -FilePath "$dir\WCL-Analyzer.exe" -ArgumentList "ui","--no-browser","--port","$port" | Out-Null
            $v = $null
            for ($i = 0; $i -lt 40 -and -not $v; $i++) { try { $v = Invoke-RestMethod "http://127.0.0.1:$port/api/version" } catch { Start-Sleep 1 } }
            if (-not $v) { throw "Прошлая версия ($prev) не запустилась" }
            Write-Host "$name : запущена сборка $($v.build)"
            return @{dir = $dir; v = $v}
          }
          $hdr = @{ Origin = "http://127.0.0.1:8796" }
          # 1) Обновление кода (так обновляется большинство выпусков): скачать, перезапуститься, работать новой сборкой
          $a = Start-Old "upd-code" 8796
          $c = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8796/api/update/check -ContentType "application/json" -Headers $hdr -Body '{}'
          Write-Host "Проверка обновлений: $($c | ConvertTo-Json -Compress)"
          if (-not $c.available -or "$($c.latest)" -ne "$env:NEW_BUILD") { throw "Прошлая версия не видит новую сборку $env:NEW_BUILD : $($c | ConvertTo-Json -Compress)" }
          if ($c.kind -eq "code") {
            $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8796/api/update/apply -ContentType "application/json" -Headers $hdr -Body '{"kind":"code"}' -TimeoutSec 600
            if (-not $r.ok) { throw "Обновление кода не прошло: $($r | ConvertTo-Json -Compress)" }
            $x = Wait-Build 8796 $env:NEW_BUILD 120
            if (-not $x) { throw "После обновления кода программа не работает новой сборкой $env:NEW_BUILD" }
            Write-Host "Обновление кода: $($a.v.build) -> $($x.build)"
            Get-Process | Where-Object { $_.Path -like "$($a.dir)*" } | Stop-Process -Force
          } else { Write-Host "Новой сборке нужна программа целиком — проверяется ниже" }
          # 2) Программа целиком: .exe скачивает новую версию, заменяет себя и перезапускается
          $b = Start-Old "upd-full" 8797
          $before = (Get-FileHash "$($b.dir)\WCL-Analyzer.exe").Hash
          $hdr = @{ Origin = "http://127.0.0.1:8797" }
          $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8797/api/update/apply -ContentType "application/json" -Headers $hdr -Body '{"kind":"full"}' -TimeoutSec 600
          if (-not $r.ok) { throw "Обновление целиком не началось: $($r | ConvertTo-Json -Compress)" }
          $x = Wait-Build 8797 $env:NEW_BUILD 180
          if (-not $x) { throw "После обновления целиком программа не перезапустилась новой сборкой $env:NEW_BUILD" }
          if ((Get-FileHash "$($b.dir)\WCL-Analyzer.exe").Hash -eq $before) { throw ".exe не заменён" }
          Write-Host "Обновление целиком: $($b.v.build) -> $($x.build)"
          Get-Process | Where-Object { $_.Path -like "$($b.dir)*" } | Stop-Process -Force

  update-phone:
    needs: publish
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      NEW_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - name: Прошлая версия приложения обновляет код до новой (загрузчик из APK)
        run: |
          set -e
          NEW="v1.1.$NEW_BUILD"
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 5 --json tagName --jq '.[].tagName' | grep -vx "$NEW" | head -1)
          if [ -z "$PREV" ]; then echo "Прошлого выпуска нет"; exit 0; fi
          echo "Прошлый выпуск: $PREV, новый: $NEW"
          body() { gh release view "$1" --repo "$GITHUB_REPOSITORY" --json body --jq .body | sed -n 's/.*<!--update \(.*\) -->.*/\1/p'; }
          OLD_JSON=$(body "$PREV"); NEW_JSON=$(body "$NEW")
          OLD_SHELL=$(echo "$OLD_JSON" | python -c "import json,sys; print(json.load(sys.stdin)['shell'])")
          NEW_SHELL=$(echo "$NEW_JSON" | python -c "import json,sys; print(json.load(sys.stdin)['shell'])")
          # Приложение как на телефоне: загрузчик wcl_boot и main.py из APK, код прошлой версии
          APP=$RUNNER_TEMP/app; rm -rf "$APP"; mkdir -p "$APP" "$RUNNER_TEMP/dl"
          gh release download "$PREV" --repo "$GITHUB_REPOSITORY" -p wcl_analyzer-code.zip -D "$RUNNER_TEMP/dl" --clobber
          unzip -q "$RUNNER_TEMP/dl/wcl_analyzer-code.zip" -d "$APP"
          cp android/main.py "$APP/"
          sed "s/^SHELL_ID = \"dev\"/SHELL_ID = \"$OLD_SHELL\"/" wcl_boot.py > "$APP/wcl_boot.py"
          export WCL_APP=android ANDROID_PRIVATE=$RUNNER_TEMP/private
          mkdir -p "$ANDROID_PRIVATE"
          start() { (cd "$APP" && python main.py > "$RUNNER_TEMP/app.log" 2>&1 &) ; for i in $(seq 1 40); do curl -sf http://127.0.0.1:8765/api/version && return 0; sleep 1; done; cat "$RUNNER_TEMP/app.log"; return 1; }
          build() { curl -sf http://127.0.0.1:8765/api/version | python -c "import json,sys; print(json.load(sys.stdin)['build'])"; }
          start; OLD_BUILD=$(build); echo; echo "Запущена сборка $OLD_BUILD"
          if [ "$OLD_SHELL" = "$NEW_SHELL" ]; then
            R=$(curl -sf -X POST -H "Content-Type: application/json" -H "Origin: http://127.0.0.1:8765" -d '{"kind":"code"}' http://127.0.0.1:8765/api/update/apply)
            echo "$R"
            echo "$R" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok'), d"
            ok=""
            for i in $(seq 1 40); do sleep 2; b=$(build 2>/dev/null || true); [ "$b" = "$NEW_BUILD" ] && ok=1 && break; done
            if [ -z "$ok" ]; then   # мягкий перезапуск не сработал — как после закрытия и открытия приложения
              pkill -f "python main.py" || true; sleep 2; start; b=$(build)
              [ "$b" = "$NEW_BUILD" ] || { cat "$RUNNER_TEMP/app.log"; echo "::error::Код не обновился: работает сборка $b, а не $NEW_BUILD"; exit 1; }
              echo "::warning::Новый код подключился только после перезапуска приложения"
            fi
            echo "Обновление кода на телефоне: $OLD_BUILD -> $NEW_BUILD"
            pkill -f "python main.py" || true; sleep 2; start; b=$(build)
            [ "$b" = "$NEW_BUILD" ] || { echo "::error::После перезапуска приложения снова старая сборка ($b)"; exit 1; }
            echo "После перезапуска приложения — новая сборка $b"
          else
            echo "Оболочка изменилась ($OLD_SHELL -> $NEW_SHELL): телефону нужен новый APK — проверяется ниже"
          fi
          pkill -f "python main.py" || true
      - name: Новый APK встаёт поверх прошлого (та же подпись, номер версии выше)
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE != '' && secrets.ANDROID_KEY_PASS != '' }}
        run: |
          set -e
          NEW="v1.1.$NEW_BUILD"
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 5 --json tagName --jq '.[].tagName' | grep -vx "$NEW" | head -1)
          [ -n "$PREV" ] || exit 0
          mkdir -p old new
          gh release download "$PREV" --repo "$GITHUB_REPOSITORY" -p WCL-Analyzer.apk -D old --clobber
          gh release download "$NEW" --repo "$GITHUB_REPOSITORY" -p WCL-Analyzer.apk -D new --clobber
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1); SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          cert() { "$SIGNER" verify --print-certs "$1" | grep -i "SHA-256 digest" | head -1; }
          vc() { "$AAPT" dump badging "$1" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p"; }
          "$SIGNER" verify new/WCL-Analyzer.apk
          O=$(cert old/WCL-Analyzer.apk); N=$(cert new/WCL-Analyzer.apk)
          echo "Подпись прошлого: $O"; echo "Подпись нового:  $N"
          if [ "$O" != "$N" ]; then
            if [ "$HAS_KEY" != "true" ]; then   # постоянного ключа нет — каждая сборка подписана временным
              echo "::warning title=Ключ подписи APK::Секреты ANDROID_KEYSTORE и ANDROID_KEY_PASS не заданы: у каждой сборки свой временный ключ, новый APK поверх прошлого не встанет. Обновление кода на телефоне работает."
            else
              echo "::error::Подпись APK изменилась — поверх прошлой версии не установится"; exit 1
            fi
          fi
          OV=$(vc old/WCL-Analyzer.apk); NV=$(vc new/WCL-Analyzer.apk)
          echo "versionCode: $OV -> $NV"
          [ "$NV" -gt "$OV" ] || { echo "::error::Номер версии APK не вырос ($OV -> $NV) — Android не поставит обновление"; exit 1; }
          echo "Новый APK встанет поверх прошлого: подпись та же, номер версии $OV -> $NV"
