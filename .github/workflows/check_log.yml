name: check-log
on:
  push:
    branches: [debug/log]
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Forever
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_GAME_DATA: bundled
        run: |
          python tools/probe_forever.py || true
          c=$(cat forever_code.txt 2>/dev/null); if [ -n "$c" ]; then python tools/check_log.py "https://forever.warcraftlogs.com/reports/$c" debug_forever_log.json > debug_forever_run.txt 2>&1 || true; fi
      - name: commit
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f debug_forever.json debug_forever_log.json debug_forever_run.txt 2>/dev/null; git add -f debug_forever.json; git commit -m "forever" && git push
