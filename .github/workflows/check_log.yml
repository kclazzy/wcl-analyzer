name: check-log
on:
  push:
    branches: [debug/log]
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Forever
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_GAME_DATA: bundled
        run: |
          python tools/probe_forever.py > debug_forever_probe.txt 2>&1 || true
          echo "::notice title=probe::$(tail -c 900 debug_forever_probe.txt | tr '\n' ' ')"

      - name: commit
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          for f in debug_forever.json debug_forever_log.json debug_forever_run.txt debug_forever_probe.txt; do [ -f $f ] && git add -f $f; done
          git commit -m "forever" && git push
