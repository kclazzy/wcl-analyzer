name: check-ids3
on:
  push:
    branches: [debug/ids3]
permissions:
  contents: write
jobs:
  ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124"}
          out = []
          for sub in ("www", "classic", "fresh", "sod", "vanilla", "era", "anniversary", "mop", "cata"):
              for path, data in (("/oauth/token", b"grant_type=client_credentials"), ("/api/v2/client", b'{"query":"{__typename}"}')):
                  u = f"https://{sub}.warcraftlogs.com{path}"
                  try:
                      h = dict(UA); h["Content-Type"] = "application/x-www-form-urlencoded" if "oauth" in path else "application/json"
                      r = urllib.request.urlopen(urllib.request.Request(u, data=data, headers=h), timeout=20)
                      out.append(f"{u}\t{r.status}\t{r.read()[:150]!r}")
                  except urllib.error.HTTPError as e:
                      out.append(f"{u}\tHTTP {e.code}\t{e.read()[:150]!r}")
                  except Exception as e:
                      out.append(f"{u}\tERR {e}")
              try:
                  t = urllib.request.urlopen(urllib.request.Request(f"https://{sub}.warcraftlogs.com/", headers=UA), timeout=20).read().decode("utf-8", "replace")
                  m = re.search(r"<title>(.*?)</title>", t, re.S)
                  out.append(f"{sub} HOME title={m.group(1).strip() if m else '-'} final")
              except Exception as e:
                  out.append(f"{sub} HOME ERR {e}")
          open("debug_ids_out.txt", "w").write("\n".join(out))
          PY
      - name: commit
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add debug_ids_out.txt && git commit -m "ids" && git push
