name: check-ids3
on:
  push:
    branches: [debug/ids3]
permissions:
  contents: write
jobs:
  upd88:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: v88 full update
        shell: pwsh
        continue-on-error: true
        run: |
          $out = @()
          $dir = Join-Path $env:RUNNER_TEMP "u88"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://github.com/kclazzy/wcl-analyzer/releases/download/v1.1.88/WCL-Analyzer.exe" -OutFile "$dir\WCL-Analyzer.exe"
          $before = (Get-FileHash "$dir\WCL-Analyzer.exe").Hash
          $out += "before=$before"
          Start-Process -FilePath "$dir\WCL-Analyzer.exe" -ArgumentList "ui","--no-browser","--port","8798" | Out-Null
          $v = $null
          for ($i = 0; $i -lt 40 -and -not $v; $i++) { try { $v = Invoke-RestMethod http://127.0.0.1:8798/api/version } catch { Start-Sleep 1 } }
          $out += "version88=" + ($v | ConvertTo-Json -Compress)
          try { $c = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8798/api/update/check -ContentType "application/json" -Body '{}' -TimeoutSec 60; $out += "check=" + ($c | ConvertTo-Json -Compress) } catch { $out += "check ERR $_" }
          try { $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8798/api/update/apply -ContentType "application/json" -Body '{"kind":"full"}' -TimeoutSec 600; $out += "apply=" + ($r | ConvertTo-Json -Compress) } catch { $out += "apply ERR $_" }
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep 2
            foreach ($port in 8765, 8798) { try { $x = Invoke-RestMethod "http://127.0.0.1:$port/api/version" -TimeoutSec 2; $out += "t=$($i*2) port=$port " + ($x | ConvertTo-Json -Compress) } catch {} }
          }
          $out += "after=" + (Get-FileHash "$dir\WCL-Analyzer.exe").Hash
          $out += "files=" + ((Get-ChildItem $dir | ForEach-Object { "$($_.Name):$($_.Length)" }) -join ",")
          $out += "procs=" + ((Get-Process | Where-Object { $_.Path -like "$dir*" } | ForEach-Object { "$($_.Id):$($_.Path)" }) -join ",")
          $out += "mei=" + ((Get-ChildItem $env:TEMP -Directory -Filter "_MEI*" -ErrorAction SilentlyContinue | ForEach-Object Name) -join ",")
          Get-Process | Where-Object { $_.Path -like "$dir*" } | Stop-Process -Force
          # второй запуск вручную (как пользователь двойным щелчком)
          Start-Process -FilePath "$dir\WCL-Analyzer.exe" -ArgumentList "ui","--no-browser","--port","8797" | Out-Null
          $w = $null
          for ($i = 0; $i -lt 40 -and -not $w; $i++) { try { $w = Invoke-RestMethod http://127.0.0.1:8797/api/version } catch { Start-Sleep 1 } }
          $out += "manual_restart=" + ($w | ConvertTo-Json -Compress)
          $out -join "`n" | Out-File -Encoding utf8 debug_ids_out.txt
      - name: commit
        shell: bash
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add debug_ids_out.txt && git commit -m "ids" && git push
